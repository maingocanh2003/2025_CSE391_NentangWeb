<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        .form-container {
            background-color: #fff;
            padding: 31px;
            border-radius: 20px;
            max-width: 700px;
            margin: auto;
            text-align: left;
            font-family:'Times New Roman', Times, serif
        }

        h2 {
            margin-top: 1px;
            color: #333;
            padding-bottom: 1px;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        label {
            width: 170px;
            font-weight: bold;
        }

        select ,textarea,input{
            flex: 1;
            padding: 8px;
        }

        textarea {
            height: 150px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
        }

        .form-group .radio-group label,
        .form-group .checkbox-group label {
            font-weight: normal;
        }

        .captcha {
            font-size: 25px;
            font-weight: dotted ;
            letter-spacing: 1px;
            padding: 5px 7px;
        }

        .captcha-group{
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        .buttons {
            display: flex ;
            justify-content: flex-end;
            margin-top: 10px;
        }

        button {
            padding: 8px 16px;
            border: 2px;
        }

        .submit-btn {
            background-color: #333;
            color: white;
        }

        .cancel-btn {
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>
    <main class="form-container">
        <section class="Basic Info">
            <h2>Basic Info</h2>
            <hr>
            <div class="form-group">
                <label>Employee ID</label>
                9
            </div>
            <div class="form-group">
                <label>Last Name</label>
                Dodsworth
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" value="Anne">
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gen"> Male</label>
                    <label><input type="radio" name="gen" > Femae</label>
                    <label><input type="radio" name="gen"> XXX</label>
                    <label><input type="radio" name="gen" checked > ZZZ</label>
                </div>
            </div>
            <div class="form-group">
                <label><b>Title</b></label>
                <input type="text" value="Sales Representative">
            </div>
            <div class="form-group">
                <label>Suffix</label>
                <input type="text" value="Ms.">
            </div>
            <div class="form-group">
                <label>BirthDate</label>
                <input type="text" value="1969-07-02 00:00:00 ">
            </div>
            <div class="form-group">
                <label>HireDate</label>
                <input type="text" value="1994-11-15 00:00:00 ">
            </div>
            <div class="form-group">
                <label>SSN # (if appicable) </label>
                <input type="text" value=" ">
            </div>
            <div class="form-group">
                <label>Reports To</label>
                <select>
                    <option>Buchanan</option>
                </select>
            </div>
        </section>
        <section class="Contact Info">
            <h2>Contact Info</h2>
            <hr>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" value="7 Houndstooth Rd.">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" value="London">
            </div>
            <div class="form-group">
                <label>Region </label>
                <input type="text" value=" ">
            </div>
            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" value="WG2 7LT">
            </div>
            <div class="form-group">
                <label>Country</label>
                <select>
                    <option>Russian Federation</option>
                </select>
            </div>
            <div class="form-group">
                <label>US Home Phone</label>
                <input type="text" value="(234)234-2342">
            </div>
            <div class="form-group">
                <label>Photo</label>
                <input type="text" value="EmpID9.bmp">
            </div>
        </section>
        <section class="Optional Info">
            <h2>Optional Info</h2>
            <hr>
            <div class="form-group">
                <label>Notes</label>
                <textarea>Anne has a BA degree in English from St. Lawrence College.
She is fluent in French and German.ZZZ </textarea>
            </div>
            <div class="form-group">
                <label>Preferred Shift</label>
                <div class="checkbox-group">
                    <label><input type="checkbox"> Regular</label>
                    <label><input type="checkbox" checked > Graveyard</label>
                </div>
            </div>
            <div class="form-group">
                <label>Active?</label>
                <div class="checkbox-group">
                    <input type="checkbox" value="true" checked>
                </div>
            </div>
            <div class="form-group">
                <label>Are you human?</label>
                <div class="captcha-group">
                    <div class="captcha">TIDAWO
                    </div>
                    <input type="text" placeholder=" ">
                </div>
            </div>

            <div class="buttons">
                <button class="submit-btn">Submit</button>
                <button class="cancel-btn">Cancel</button>
            </div>
        </section>
    </main>
</body>

</html>
